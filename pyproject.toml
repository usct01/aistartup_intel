[project]
name = "aistartup-intel"
version = "0.1.0"
description = "AI Startup Signal — multi-agent intelligence platform for tracking AI startups and funding."
readme = "README.md"
authors = [{ name = "usct01", email = "usct01@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.35",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "tenacity>=9.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    "openai>=1.50",
    "typer>=0.12",
    "pyyaml>=6.0",
    "redis>=5.0",
]

[project.optional-dependencies]
adk = ["google-adk>=0.5"]
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]

[project.scripts]
aistartup-intel = "aistartup_intel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-python-dateutil>=2.9",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/aistartup_intel/api/app.py" = ["B008"]
"src/aistartup_intel/cli.py" = ["B008"]
"tests/*" = ["B008"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
