name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Lint, Typecheck & Test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff linter
        run: uv run ruff check src tests

      - name: Run Mypy type checker
        run: uv run mypy src

      - name: Run Pytest suite
        env:
          AISI_LLM_OFFLINE: "true"
        run: uv run pytest

      - name: Verify offline demo pipeline
        env:
          AISI_LLM_OFFLINE: "true"
        run: uv run aistartup-intel demo

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for Node project
        id: check_web
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check_web.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        if: steps.check_web.outputs.exists == 'true'
        run: npm ci

      - name: Run linter (if configured)
        if: steps.check_web.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Build frontend (if configured)
        if: steps.check_web.outputs.exists == 'true'
        run: npm run build --if-present
